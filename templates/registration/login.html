{% extends "base.html" %}
{% block title %}تسجيل الدخول — Future Mind{% endblock %}
{% block content %}
<div class="container auth">
  <form class="panel" method="post">
    {% csrf_token %}
    <h1>تسجيل الدخول</h1>
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">دخول</button>
    <p class="muted">ليس لديك حساب؟ <a href="{% url 'signup' %}">أنشئ حساباً</a></p>
  </form>
</div>
{% endblock %}
